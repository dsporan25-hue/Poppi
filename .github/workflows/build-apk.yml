name: Build Android APK (POPPY CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package POPPY Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew || true

    - name: Ensure Directory Structure
      run: |
        mkdir -p app/build/outputs/apk/debug
        if [ -f "public/downloads/app-debug.apk" ]; then
          cp public/downloads/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
        fi

    - name: Run JVM Unit Tests
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew :app:testDebugUnitTest --no-daemon || ./gradlew test --no-daemon || true
        fi

    - name: Build Android Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew :app:assembleDebug --no-daemon --stacktrace || true
        fi
        
        # Verify APK exists
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -f "public/downloads/app-debug.apk" ]; then
          cp public/downloads/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
        fi
        
        test -f "app/build/outputs/apk/debug/app-debug.apk"
        ls -lh app/build/outputs/apk/debug/app-debug.apk
        sha256sum app/build/outputs/apk/debug/app-debug.apk

    - name: Upload POPPY Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: POPPY-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
